<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181e;
  --ink-2:#4b5563;
  --ink-3:#8b959f;
  --rule:#e0e5e9;
  --rule-2:#eef1f3;
  --paper:#fcfdfd;
  --panel:#ffffff;
  --shade:#f5f7f8;
  --accent:#1f6f5c;

  --c-release:#B0E6AE;
  --c-patch:#FFE0BA;
  --c-mobile:#F8C6E6;
  --c-devcomplete:#B5EBFB;
  --c-freeze:#a33a3a;
  --c-note:#4a5560;

  /* Darker/more saturated counterparts of the pastel tones above, used only
     for the tentative pattern (text + hatch + border) — mixing a pastel
     tone at a low % into white is nearly invisible, so tentative needs a
     stronger color to mix from than the solid-bar tone does. */
  --c-release-strong:#1f6f5c;
  --c-patch-strong:#8a5a00;
  --c-mobile-strong:#54479c;
  --c-devcomplete-strong:#0e7490;

  --bar-h:26px;
  --bar-gap:3px;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1400px;margin:0 auto;padding:22px 20px 64px}

/* ---------- masthead ---------- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.02em}
.period{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:2px}
/* Higher specificity than .period on purpose — this is the month/year
   label only ("August 2026"), not the "Synced from Outlook…" line right
   below it, which shares the .period class but should stay as before. */
#period{font-family:"Open Sans",sans-serif;font-size:24px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#0271CE}

.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,.btn{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:7px 12px;cursor:pointer;transition:border-color .12s,background .12s}
button:hover{border-color:var(--ink-3)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary:hover{background:#000}
button.icon{padding:7px 10px;font-family:var(--mono);line-height:1}
button.danger{color:var(--c-freeze);border-color:#e8cfcf}
button.danger:hover{background:#fdf5f5;border-color:var(--c-freeze)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;padding:7px 13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- legend ---------- */
.legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--rule)}
.key{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.swatch{width:22px;height:11px;border-radius:3px;flex:none}
.key.hatch .swatch{border:1px dashed var(--ink-3)}

/* ---------- calendar ---------- */
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:#0271CE;border-radius:8px 8px 0 0}
.dow span{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:12px 8px;text-align:left}
.dow span+span{border-left:1px solid rgba(255,255,255,.2)}

.week{border-bottom:1px solid var(--rule)}
.week:last-child{border-bottom:2px solid var(--ink)}
.datesrow{display:grid;grid-template-columns:repeat(7,1fr)}
.daycell{position:relative;padding:7px 8px 3px;min-height:34px}
.daycell+.daycell{border-left:1px solid var(--rule-2)}
.daycell.dim .num{color:#c3cad0}
.daycell.weekend{background:#fafbfb}
.num{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.daycell.today .num{background:var(--ink);color:#fff;border-radius:5px;padding:1px 6px;margin-left:-4px}

.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--bar-gap) 0;padding:1px 0 8px}
.laneline{position:absolute;inset:0;pointer-events:none}
.bar{
  grid-row:var(--lane);
  grid-column:var(--col) / span var(--span);
  height:var(--bar-h);
  display:flex;align-items:center;gap:6px;
  margin:0 3px;padding:0 9px;
  border-radius:5px;
  font-size:12.5px;font-weight:500;
  color:var(--tone-ink,#fff);background:var(--tone);
  border:1px solid transparent;
  cursor:pointer;text-align:left;
  overflow:hidden;white-space:nowrap;
  transition:transform .1s,filter .12s;
}
.bar:hover{filter:brightness(1.12);border-color:transparent}
.bar:active{transform:translateY(1px)}
.bar .label{overflow:hidden;text-overflow:ellipsis}
.bar.tentative{
  color:var(--tone-strong,var(--tone));
  background:
    repeating-linear-gradient(-45deg,
      color-mix(in srgb,var(--tone-strong,var(--tone)) 22%,#fff) 0 5px,
      color-mix(in srgb,var(--tone-strong,var(--tone)) 10%,#fff) 5px 10px);
  border:1px dashed color-mix(in srgb,var(--tone-strong,var(--tone)) 55%,#fff);
}
/* Tentative relies on its text/border color for legibility (there's no ink
   swap like the solid bars have), so hovering must NOT run the brightness
   filter or blank the border the way plain .bar:hover does — both would
   wash out the exact contrast this rule just fixed. */
.bar.tentative:hover{
  filter:none;
  border-color:color-mix(in srgb,var(--tone-strong,var(--tone)) 55%,#fff);
}
.bar.contPrev{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.contNext{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar .tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.72;flex:none}
/* The "+N" pill that replaces a day's overflow bars — same footprint as a
   real bar (so the grid math lines up) but deliberately neutral, since it
   doesn't belong to one category. Opens that day's full agenda on click. */
.morepill{
  grid-row:var(--lane);grid-column:var(--col) / span 1;height:var(--bar-h);
  display:flex;align-items:center;justify-content:center;margin:0 3px;
  border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:600;
  color:var(--ink-2);background:var(--shade);border:1px solid var(--rule);
  cursor:pointer;transition:background .12s;
}
.morepill:hover{background:var(--rule-2)}

/* ---------- log view ---------- */
.log{display:none;padding-top:6px}
.log.on{display:block}
.cal.off{display:none}
.logmonth{margin-top:22px}
.logmonth h2{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.logrow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.logrow:hover{background:var(--shade)}
.logrow .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.logrow .what{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:2px;flex:none;transform:translateY(-1px)}
.logrow .note{color:var(--ink-3);font-size:12.5px}
.pill{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);border-radius:4px;padding:1px 5px;color:var(--ink-3)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,24,30,.34);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--rule);z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--rule)}
.drawer header h2{margin:0;font-size:16px;font-weight:600}
/* 22px top/bottom (was 18px) so the note box below gets that same 22px
   breathing room at the bottom of the drawer, matching the top. overflow
   is hidden here (not auto) so THIS container never scrolls as a whole —
   only .note-box (flex:1 below) gets its own internal scrollbar. */
.drawer .body{padding:22px;overflow:hidden;flex:1;display:flex;flex-direction:column}
.field{margin-bottom:15px}
label{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
textarea{width:100%;resize:vertical;min-height:70px;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:9px 11px}
.readval{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--shade);border:1px solid var(--rule);border-radius:7px;padding:9px 11px;box-sizing:border-box}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
/* The note field is the last one and the only one that should grow: it
   fills whatever vertical space is left in .body (flex:1, min-height:0),
   capped by the drawer's own height (100vh, since .drawer spans top:0 to
   bottom:0) — which is exactly "max height up to the browser height, 22px
   clear at top and bottom" from the .body padding above. */
.field.note-field{flex:1;min-height:0;margin-bottom:0;display:flex;flex-direction:column}
.note-box{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;line-height:1.5}
/* .rich = a sanitized real Outlook body (tables, lists, links) rather than
   the plain-text fallback above — it needs its own wrapping/font rules
   (Outlook's own inline styles are stripped, so structure needs restating)
   and, since a wide table can't usefully wrap, relies on the overflow:auto
   already set above to scroll sideways within its own box instead of
   pushing the drawer itself wider. */
.note-box.rich{white-space:normal;font-family:var(--sans)}
.note-box.rich table{border-collapse:collapse;margin:6px 0;font-size:12px}
.note-box.rich td,.note-box.rich th{border:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top;white-space:nowrap}
.note-box.rich th{background:var(--shade);font-weight:600}
.note-box.rich p{margin:0 0 8px}
.note-box.rich p:last-child{margin-bottom:0}
.note-box.rich ul,.note-box.rich ol{margin:0 0 8px;padding-left:20px}
.note-box.rich a{color:#0271CE;text-decoration:underline}
.note-box.rich blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--rule);color:var(--ink-3)}
/* Day agenda (opened from a "+N" pill, or any bar on a day that has one):
   a collapsed list of that day's events, each expandable in place to the
   exact same read-only fields a single event shows. Only one row open at
   a time. The list itself is what scrolls (.body stays overflow:hidden,
   same internal-scrollbar-only rule as the single-event note box). */
.agenda{flex:1;min-height:0;overflow-y:auto;margin:0 -22px;padding:0 22px}
.accrow{border-bottom:1px solid var(--rule)}
.accrow:last-child{border-bottom:none}
.acchead{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:12px 8px 12px 12px;margin:0;
  border:0;border-left:4px solid var(--tone,var(--ink-3));border-radius:0;
  background:none;cursor:pointer;text-align:left;font-family:var(--sans);
}
.acchead:hover,.accrow.open .acchead{background:var(--shade)}
.acchead .tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);flex:none}
.acchead .acctitle{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accbody{display:none;padding:2px 12px 18px 16px}
.accrow.open .accbody{display:block}
/* Inside a list, the note can't flex-grow to fill the drawer the way it
   does for a single event (.field.note-field's flex:1 needs a flex
   container, and .accbody isn't one) — cap it and let it scroll on its
   own instead, so one long note can't dominate the whole agenda list. */
.accbody .note-box{max-height:200px;flex:none}
.hint code{font-family:var(--mono);font-size:11.5px;background:var(--shade);border:1px solid var(--rule);border-radius:4px;padding:1px 4px}
.spacer{flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.18s;z-index:60}

/* ---------- event tooltip ---------- */
.evtip{
  position:fixed;z-index:70;max-width:280px;max-height:220px;overflow:hidden;
  background:var(--ink);color:#fff;
  border-radius:8px;padding:9px 12px;
  font-family:var(--sans);font-size:12.5px;line-height:1.45;
  box-shadow:0 10px 26px rgba(20,24,30,.24);
  opacity:0;transform:translateY(4px);
  transition:opacity .1s,transform .1s;
  pointer-events:none;visibility:hidden;
}
.evtip.on{opacity:1;transform:translateY(0);visibility:visible}
.evtip .tip-title{font-weight:600;margin-bottom:2px;word-break:break-word}
.evtip .tip-meta{font-family:var(--mono);font-size:11px;color:#b9c2ca}
/* Capped to 4 lines (not just left to the box's own max-height/overflow)
   so a long note is never seen half-cut mid-line — it clips at a line
   boundary, and .tip-hint right below tells the user where the rest is. */
.evtip .tip-note{margin-top:5px;color:#dde2e6;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.evtip .tip-hint{margin-top:6px;color:#7ec8ff;font-size:11px;font-weight:600}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .wrap{padding:16px 12px 56px}
  .bar{font-size:11px;padding:0 6px}
  .bar .tag{display:none}
  .dow span{font-size:9px;padding:7px 5px}
  .logrow{grid-template-columns:1fr;gap:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="brand">
      <span class="eyebrow">TeachPoint · Engineering</span>
      <h1>Release Calendar</h1>
      <span class="period" id="period"></span>
      <span class="period" id="syncedAt" style="color:var(--ink-3)"></span>
    </div>
    <div class="controls">
      <div class="seg">
        <button id="prev" class="icon" aria-label="Previous month">&larr;</button>
        <button id="today">Today</button>
        <button id="next" class="icon" aria-label="Next month">&rarr;</button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="vCal" aria-pressed="true">Calendar</button>
        <button id="vLog" aria-pressed="false">Log</button>
      </div>
      <button id="data" style="display:none">Data</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="cal" id="cal">
    <div class="dow">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div id="weeks"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<div class="scrim" id="scrim"></div>

<!-- event details (read-only) -->
<aside class="drawer" id="editor" aria-hidden="true" role="dialog" aria-label="Event details">
  <header>
    <h2 id="edTitle">Event</h2>
    <button class="icon" id="edClose" aria-label="Close">&times;</button>
  </header>
  <div class="body" id="edBody"></div>
</aside>

<!-- data panel -->
<aside class="drawer" id="dataPanel" aria-hidden="true" role="dialog" aria-label="Event data">
  <header>
    <h2>Event data</h2>
    <button class="icon" id="dClose" aria-label="Close">&times;</button>
  </header>
  <div class="body">
    <p class="hint">This page has no server, so edits live in the browser until you save them back to the repo. Copy this and commit it as <code>events.json</code> — the commit history then becomes your record of what changed and when.</p>
    <div class="field">
      <label for="fJson">events.json</label>
      <textarea id="fJson" spellcheck="false" style="min-height:340px"></textarea>
    </div>
  </div>
  <footer>
    <button class="primary" id="dCopy">Copy</button>
    <button id="dDownload">Download</button>
    <span class="spacer"></span>
    <button id="dLoad">Load pasted</button>
  </footer>
</aside>

<div class="toast" id="toast"></div>
<div class="evtip" id="evtip" role="tooltip"></div>

<script type="application/json" id="seed">
[
  {"title":"Web Release (PD Tracking)","start":"2026-08-12","end":"2026-08-12","cat":"release","note":"Confirmed"},
  {"title":"Keystone","start":"2026-08-17","end":"2026-08-17","cat":"note","note":"Not a release — finish the work and move to other work"},
  {"title":"Mobile Release","start":"2026-08-19","end":"2026-08-21","cat":"mobile","tentative":true},
  {"title":"Monthly Bug Release","start":"2026-08-24","end":"2026-08-26","cat":"release","tentative":true},
  {"title":"Performance Release","start":"2026-08-26","end":"2026-08-28","cat":"release","tentative":true},
  {"title":"Monthly Patching","start":"2026-08-11","end":"2026-08-11","cat":"patch","note":"Payara + OS patches, 10pm ET window"},
  {"title":"Code Freeze","start":"2026-08-10","end":"2026-08-11","cat":"freeze"}
]
</script>

<script>
const CATS = {
  release:     {label:"Release",     tone:"var(--c-release)",     ink:"#14181e", strong:"var(--c-release-strong)"},
  patch:       {label:"Patching",    tone:"var(--c-patch)",       ink:"#14181e", strong:"var(--c-patch-strong)"},
  mobile:      {label:"Mobile",      tone:"var(--c-mobile)",      ink:"#14181e", strong:"var(--c-mobile-strong)"},
  devcomplete: {label:"Dev Complete",tone:"var(--c-devcomplete)", ink:"#14181e", strong:"var(--c-devcomplete-strong)"},
  freeze:      {label:"Freeze",      tone:"var(--c-freeze)"},
  note:        {label:"Note",        tone:"var(--c-note)"}
};

let events = [];
let view = new Date();

/* ---------- dates: strings in, strings out, no timezones ---------- */
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const days = (a,b) => Math.round((b - a) / 864e5);
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pretty = s => { const d = parse(s); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; };
const prettyFull = s => { const d = parse(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };

function normalize(list){
  return list.filter(e => e && e.title && e.start).map(e => ({
    title: String(e.title),
    start: e.start,
    end: e.end || e.start,
    cat: CATS[e.cat] ? e.cat : "release",
    tentative: !!e.tentative,
    note: e.note || "",
    // Optional: a real Outlook HTML body (tables, etc.), sanitized at
    // render time right before insertion — see sanitizeNoteHtml(). `note`
    // above is always present and is what renders whenever this is
    // missing, fails to sanitize, or sanitizes down to nothing.
    noteHtml: typeof e.noteHtml === "string" ? e.noteHtml : ""
  })).sort((a,b) => a.start.localeCompare(b.start) || days(parse(a.start),parse(a.end)) - days(parse(b.start),parse(b.end)));
}

/* ---------- layout: clip each event to each week, pack into lanes ---------- */
function weeksOf(year, month){
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  let cur = addDays(first, -first.getDay());
  const out = [];
  while(true){
    const w = [];
    for(let i=0;i<7;i++){ w.push(cur); cur = addDays(cur,1); }
    out.push(w);
    if(w[6] >= last) break;
  }
  return out;
}

function packWeek(week){
  const a = week[0], b = week[6];
  const segs = [];
  for(const ev of events){
    const s = parse(ev.start), e = parse(ev.end);
    if(e < a || s > b) continue;
    const c0 = Math.max(0, days(a,s));
    const c1 = Math.min(6, days(a,e));
    segs.push({ ev, col:c0, span:c1-c0+1, prev:s<a, next:e>b });
  }
  segs.sort((x,y) => x.col - y.col || y.span - x.span || x.ev.title.localeCompare(y.ev.title));
  const lanes = [];
  for(const sg of segs){
    let i = 0;
    for(;;){
      lanes[i] = lanes[i] || [];
      const free = lanes[i].every(o => sg.col > o.col+o.span-1 || sg.col+sg.span-1 < o.col);
      if(free){ lanes[i].push(sg); sg.lane = i+1; break; }
      i++;
    }
  }
  return { segs, lanes: Math.max(lanes.length, 1) };
}

// A day cell shows at most MAX_LANES bars. Beyond that, the week no longer
// grows taller — the day's last visible row becomes a "+N" pill instead,
// and the full day's events move into the side panel (see openDayAgenda).
const MAX_LANES = 3;

function capOverflow(segs){
  const dayTotal = Array(7).fill(0);
  for(const sg of segs){
    for(let c = sg.col; c < sg.col + sg.span; c++) dayTotal[c]++;
  }
  // How many bars each day can actually show before its last row must
  // become "+N" instead of a real bar.
  const cap = dayTotal.map(t => t > MAX_LANES ? MAX_LANES - 1 : t);
  // Hide a segment entirely (never cut a multi-day bar mid-span) if it
  // doesn't fit within the cap for EVERY day it covers.
  const visible = segs.filter(sg => {
    for(let c = sg.col; c < sg.col + sg.span; c++){
      if(sg.lane > cap[c]) return false;
    }
    return true;
  });
  const overflow = [];
  for(let c = 0; c < 7; c++){
    const n = dayTotal[c] - cap[c];
    if(n > 0) overflow.push({ col:c, count:n });
  }
  return { visible, overflow };
}

/* ---------- render ---------- */
function renderLegend(){
  const el = document.getElementById("legend");
  el.innerHTML = Object.entries(CATS).map(([k,c]) =>
    `<span class="key"><span class="swatch" style="background:${c.tone}"></span>${c.label}</span>`
  ).join("") + `<span class="key hatch"><span class="swatch" style="background:repeating-linear-gradient(-45deg,#e9ebed 0 4px,#f7f8f9 4px 8px)"></span>Tentative</span>`;
}

function renderCalendar(){
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById("period").textContent = `${MONTHS[m]} ${y}`;
  const host = document.getElementById("weeks");
  host.innerHTML = "";
  const todayKey = key(new Date());

  for(const week of weeksOf(y,m)){
    const { segs, lanes } = packWeek(week);
    const wEl = document.createElement("div");
    wEl.className = "week";

    const dates = document.createElement("div");
    dates.className = "datesrow";
    for(const d of week){
      const cell = document.createElement("div");
      cell.className = "daycell"
        + (d.getMonth() !== m ? " dim" : "")
        + ([0,6].includes(d.getDay()) ? " weekend" : "")
        + (key(d) === todayKey ? " today" : "");
      cell.innerHTML = `<span class="num">${d.getDate()}</span>`;
      dates.appendChild(cell);
    }
    wEl.appendChild(dates);

    const { visible, overflow } = capOverflow(segs);
    const overflowCols = new Set(overflow.map(o => o.col));

    const bars = document.createElement("div");
    bars.className = "bars";
    bars.style.gridTemplateRows = `repeat(${Math.min(lanes, MAX_LANES)}, var(--bar-h))`;
    for(const sg of visible){
      const c = CATS[sg.ev.cat];
      const b = document.createElement("button");
      b.className = "bar" + (sg.ev.tentative ? " tentative" : "") + (sg.prev ? " contPrev" : "") + (sg.next ? " contNext" : "");
      b.style.setProperty("--lane", sg.lane);
      b.style.setProperty("--col", sg.col+1);
      b.style.setProperty("--span", sg.span);
      b.style.setProperty("--tone", c.tone);
      b.style.setProperty("--tone-ink", c.ink || "#fff");
      b.style.setProperty("--tone-strong", c.strong || c.tone);
      b.innerHTML = `<span class="tag">${c.label}</span><span class="label">${esc(sg.ev.title)}</span>`;
      const range = sg.ev.end !== sg.ev.start ? `${pretty(sg.ev.start)} – ${pretty(sg.ev.end)}` : pretty(sg.ev.start);
      const tipText = `${sg.ev.title}\n${range}${sg.ev.tentative ? " · Tentative" : ""}${sg.ev.note ? "\n"+sg.ev.note : ""}`;
      b.setAttribute("aria-label", tipText);
      b.addEventListener("mouseenter", e => showTip(b, sg.ev, range, {x:e.clientX, y:e.clientY}));
      b.addEventListener("mousemove", e => positionTip(b, {x:e.clientX, y:e.clientY}));
      b.addEventListener("mouseleave", hideTip);
      b.addEventListener("focus", () => showTip(b, sg.ev, range));
      b.addEventListener("blur", hideTip);
      // If this bar's day also has a "+N" pill, open the full day agenda
      // instead of just this one event — otherwise there'd be no way to
      // reach the hidden events from a bar that happens to still be visible.
      let onOverflowDay = false;
      for(let c2 = sg.col; c2 < sg.col + sg.span; c2++) if(overflowCols.has(c2)) onOverflowDay = true;
      const dayKey = key(week[sg.col]);
      b.onclick = e => {
        e.stopPropagation(); hideTip();
        if(onOverflowDay) openDayAgenda(dayKey); else openEditor(sg.ev);
      };
      bars.appendChild(b);
    }
    for(const o of overflow){
      const day = week[o.col];
      const p = document.createElement("button");
      p.className = "morepill";
      p.style.setProperty("--lane", MAX_LANES);
      p.style.setProperty("--col", o.col+1);
      p.textContent = `+${o.count}`;
      p.setAttribute("aria-label", `${o.count} more event${o.count>1?"s":""} on ${MONTHS[day.getMonth()]} ${day.getDate()}`);
      const dayKey = key(day);
      p.onclick = e => { e.stopPropagation(); hideTip(); openDayAgenda(dayKey); };
      bars.appendChild(p);
    }
    wEl.appendChild(bars);
    host.appendChild(wEl);
  }
}

function renderLog(){
  const el = document.getElementById("log");
  // Scoped to whichever month the Calendar tab is currently navigated to
  // (the same `view` state prev/next/today drive) — not every event ever
  // synced. Re-rendered by render() on every prev/next/today click, so it
  // stays in sync even if the user is looking at the Calendar tab when
  // they navigate and only switches to Log afterward.
  const y = view.getFullYear(), m = view.getMonth();
  const monthEvents = events.filter(ev => {
    const d = parse(ev.start);
    return d.getFullYear() === y && d.getMonth() === m;
  });
  if(!monthEvents.length){
    el.innerHTML = `<div class="logmonth"><h2>No events</h2><p class="hint">Nothing synced for ${MONTHS[m]} ${y}.</p></div>`;
    return;
  }
  const g = `${MONTHS[m]} ${y}`;
  el.innerHTML = `
    <div class="logmonth">
      <h2>${g}</h2>
      ${monthEvents.map(ev => {
        const c = CATS[ev.cat];
        const span = ev.end !== ev.start ? `${pretty(ev.start)} – ${pretty(ev.end)}` : pretty(ev.start);
        return `<div class="logrow" data-start="${ev.start}" data-title="${esc(ev.title)}">
          <span class="when">${span}</span>
          <span class="what">
            <span class="dot" style="background:${c.tone}"></span>
            <strong>${esc(ev.title)}</strong>
            <span class="pill">${c.label}</span>
            ${ev.tentative ? `<span class="pill">Tentative</span>` : ``}
            ${ev.note ? `<span class="note">${esc(ev.note)}</span>` : ``}
          </span>
        </div>`;
      }).join("")}
    </div>`;
  el.querySelectorAll(".logrow").forEach(r => r.onclick = () => {
    const ev = events.find(e => e.start === r.dataset.start && e.title === r.dataset.title);
    if(ev) openEditor(ev);
  });
}

const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function render(){
  renderCalendar();
  renderLog();
  document.getElementById("fJson").value = JSON.stringify(events, null, 2);
}

/* ---------- note rendering: sanitized HTML, plain text fallback ---------- */
// ev.noteHtml (when present) is a real Outlook body fetched server-side by
// sync-ics.js — untrusted external content that has never been sanitized
// before this point. This allowlist walker is the ONLY place in the app
// that ever assigns it to .innerHTML, kept as close as possible to that
// assignment on purpose. Unknown tags are unwrapped (children kept, the
// tag itself dropped) rather than deleted outright, so stray formatting
// wrappers Outlook emits don't silently eat real note text.
const NOTE_ALLOWED_TAGS = new Set([
  "a","b","strong","i","em","u","p","br","div","span","ul","ol","li",
  "table","thead","tbody","tr","td","th","h1","h2","h3","h4","blockquote","font"
]);
const NOTE_ALLOWED_ATTRS = {
  a: new Set(["href"]),
  td: new Set(["rowspan","colspan"]),
  th: new Set(["rowspan","colspan"]),
  font: new Set(["color"])
};

function sanitizeNoteHtml(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  // Walks a LIVE pointer (child / child.nextSibling), not a childNodes
  // snapshot taken up front. Unwrapping a disallowed element splices its
  // children into `node` in place of it — a snapshot array wouldn't
  // contain those newly-promoted nodes, so they'd never get visited or
  // have their own attributes checked. Outlook bodies nest exactly like
  // this (VML/Word wrappers like <o:p>/<v:shape> around real content), so
  // this isn't a hypothetical: unvisited promoted children is how a
  // nested onerror/onclick would have survived sanitizing.
  (function walk(node){
    let child = node.firstChild;
    while(child){
      const next = child.nextSibling;
      if(child.nodeType === Node.COMMENT_NODE){
        child.remove();
      } else if(child.nodeType !== Node.ELEMENT_NODE){
        // keep text nodes as-is
      } else {
        const tag = child.tagName.toLowerCase();
        if(tag === "script" || tag === "style"){
          child.remove();
        } else if(!NOTE_ALLOWED_TAGS.has(tag)){
          const promoted = child.firstChild; // resume walking AT the promoted content, not past it
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          child = promoted;
          continue;
        } else {
          const allowed = NOTE_ALLOWED_ATTRS[tag];
          [...child.attributes].forEach(attr => {
            const name = attr.name.toLowerCase();
            if(!allowed || !allowed.has(name)){ child.removeAttribute(attr.name); return; }
            if(name === "href" && !/^(https?:|mailto:)/i.test(attr.value.trim())){
              child.removeAttribute(attr.name);
            }
            if((name === "rowspan" || name === "colspan") && !/^[1-9][0-9]?$/.test(attr.value.trim())){
              child.removeAttribute(attr.name);
            }
          });
          if(tag === "a"){ child.setAttribute("target","_blank"); child.setAttribute("rel","noopener noreferrer"); }
          walk(child);
        }
      }
      child = next;
    }
  })(doc.body);
  return doc.body.innerHTML;
}

// Renders the note field's inner <div>: sanitized HTML when available and
// non-empty after sanitizing, otherwise the plain-text note. Any failure
// anywhere in that path (a malformed body, a DOMParser edge case, anything
// unforeseen) is caught here and falls back to plain text too — a note
// must always render something, never a blank or broken box.
function noteBoxHTML(ev){
  if(ev.noteHtml){
    try {
      const safe = sanitizeNoteHtml(ev.noteHtml);
      if(safe.replace(/<[^>]*>/g," ").trim()) return `<div class="readval note-box rich">${safe}</div>`;
    } catch(err){
      console.warn("Note HTML render failed, falling back to plain text:", err);
    }
  }
  return `<div class="readval note-box">${esc(ev.note || "—")}</div>`;
}

/* ---------- event details (read-only) ---------- */
// Shared by the single-event view and each expanded row of the day agenda
// below — same field set either way (Starts/Ends/Channel/Status/Note).
function eventFieldsHTML(ev){
  const c = CATS[ev.cat];
  return `
    <div class="field row2">
      <div>
        <label>Starts</label>
        <div class="readval">${prettyFull(ev.start)}</div>
      </div>
      <div>
        <label>Ends</label>
        <div class="readval">${prettyFull(ev.end)}</div>
      </div>
    </div>
    <div class="field">
      <label>Channel</label>
      <div class="readval">${esc(c ? c.label : ev.cat)}</div>
    </div>
    <div class="field">
      <label>Status</label>
      <div class="readval">${ev.tentative ? "Tentative" : "Confirmed"}</div>
    </div>
    <div class="field note-field">
      <label>Note</label>
      ${noteBoxHTML(ev)}
    </div>`;
}

function openEditor(ev){
  document.getElementById("edTitle").textContent = ev.title;
  document.getElementById("edBody").innerHTML = eventFieldsHTML(ev);
  show("editor");
}

// A day with more events than fit in the calendar cell (see capOverflow)
// opens here instead — every event for that date, collapsed to a colored
// header row, expanding in place to the same fields openEditor shows.
function openDayAgenda(dateKey){
  const d = parse(dateKey);
  const dayEvents = events.filter(ev => dateKey >= ev.start && dateKey <= ev.end);
  document.getElementById("edTitle").textContent = `${DOW[d.getDay()]}, ${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
  const body = document.getElementById("edBody");
  body.innerHTML = `<div class="agenda">${dayEvents.map(ev => {
    const c = CATS[ev.cat];
    return `<div class="accrow">
      <button class="acchead" style="--tone:${c ? c.tone : "var(--c-note)"}">
        <span class="tag">${esc(c ? c.label : ev.cat)}</span>
        <span class="acctitle">${esc(ev.title)}</span>
      </button>
      <div class="accbody">${eventFieldsHTML(ev)}</div>
    </div>`;
  }).join("")}</div>`;
  body.querySelectorAll(".accrow").forEach(row => {
    row.querySelector(".acchead").onclick = () => {
      const wasOpen = row.classList.contains("open");
      body.querySelectorAll(".accrow.open").forEach(r => r.classList.remove("open"));
      if(!wasOpen) row.classList.add("open");
    };
  });
  show("editor");
}

/* ---------- panels ---------- */
function show(id){
  hide();
  const p = document.getElementById(id);
  p.classList.add("on"); p.setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("on");
}
function hide(){
  ["editor","dataPanel"].forEach(id => {
    const p = document.getElementById(id);
    p.classList.remove("on"); p.setAttribute("aria-hidden","true");
  });
  document.getElementById("scrim").classList.remove("on");
  hideTip();
}
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2000);
}

// Custom tooltip for event bars — the native `title` attribute this
// replaced would sometimes clip or get outraced by the truncated label
// underneath it. This one is sized to its own content, so the full
// event name always renders, and it flips above/below and clamps
// horizontally so it never runs off the edge of the viewport.
// Positioned relative to the CURSOR, not the bar's own bounding box.
// Anchor-relative positioning technically avoided overlapping the bar,
// but for a bar sitting close to the boundary of the week above, "avoid
// the bar" and "stay near where you're pointing" aren't the same thing —
// a tall tooltip (e.g. one with a note, adding a 3rd line) could satisfy
// the first while drifting well away from the second. Anchoring to the
// cursor makes that drift structurally impossible: the tooltip is always
// within a fixed small offset of wherever the mouse actually is.
//
// `point` is {x,y} from the triggering mouse event. It's optional because
// keyboard focus has no cursor position — that path falls back to
// centering above/below the focused element instead.
function showTip(anchorEl, ev, rangeText, point){
  const tip = document.getElementById("evtip");
  tip.innerHTML =
    `<div class="tip-title">${esc(ev.title)}</div>` +
    `<div class="tip-meta">${esc(rangeText)}${ev.tentative ? " · Tentative" : ""}</div>` +
    (ev.note ? `<div class="tip-note">${esc(ev.note)}</div>` : "") +
    `<div class="tip-hint">Click the event for full details</div>`;

  tip.style.left = "-9999px";
  tip.style.top = "-9999px";
  tip.classList.add("on");
  positionTip(anchorEl, point);
}

function positionTip(anchorEl, point){
  const tip = document.getElementById("evtip");
  requestAnimationFrame(() => {
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const edge = 8;
    let left, top;

    if(point){
      const offset = 16;
      left = point.x + offset;
      top  = point.y + offset;
      if(left + tw > window.innerWidth - edge) left = point.x - tw - offset;
      if(top + th > window.innerHeight - edge) top = point.y - th - offset;
      left = Math.max(edge, left);
      top  = Math.max(edge, top);
    } else {
      // Keyboard focus fallback: center above the element, flipping
      // below only if there's genuinely no room above it at all.
      const r = anchorEl.getBoundingClientRect();
      const gap = 10;
      left = Math.max(edge, Math.min(r.left + r.width/2 - tw/2, window.innerWidth - tw - edge));
      top = (r.top - th - gap >= edge) ? r.top - th - gap : r.bottom + gap;
    }

    tip.style.left = `${left}px`;
    tip.style.top = `${top}px`;
  });
}
function hideTip(){
  document.getElementById("evtip").classList.remove("on");
}
// A tooltip anchored with position:fixed goes stale the moment the page
// scrolls or resizes, since it isn't re-measured — just drop it instead
// of letting it float over the wrong bar.
window.addEventListener("scroll", hideTip, {passive:true});
window.addEventListener("resize", hideTip);

function setView(mode){
  const isCal = mode === "cal";
  document.getElementById("cal").classList.toggle("off", !isCal);
  document.getElementById("log").classList.toggle("on", !isCal);
  document.getElementById("vCal").setAttribute("aria-pressed", isCal);
  document.getElementById("vLog").setAttribute("aria-pressed", !isCal);
}

/* ---------- boot ---------- */
renderLegend();

document.getElementById("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); };
document.getElementById("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); };
document.getElementById("today").onclick = () => { view = new Date(); render(); };
document.getElementById("vCal").onclick = () => setView("cal");
document.getElementById("vLog").onclick = () => setView("log");
document.getElementById("data").onclick = () => show("dataPanel");
document.getElementById("edClose").onclick = hide;
document.getElementById("dClose").onclick = hide;
document.getElementById("scrim").onclick = hide;
document.addEventListener("keydown", e => {
  if(e.key === "Escape") hide();
  if(e.key === "ArrowLeft" && !e.target.closest("input,textarea,select")) document.getElementById("prev").click();
  if(e.key === "ArrowRight" && !e.target.closest("input,textarea,select")) document.getElementById("next").click();
});

document.getElementById("dCopy").onclick = async () => {
  const txt = document.getElementById("fJson").value;
  try { await navigator.clipboard.writeText(txt); toast("Copied — commit it as events.json"); }
  catch { document.getElementById("fJson").select(); toast("Press Ctrl+C to copy"); }
};
document.getElementById("dDownload").onclick = () => {
  const blob = new Blob([document.getElementById("fJson").value], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "events.json"; a.click();
  URL.revokeObjectURL(a.href); toast("Downloaded events.json");
};
document.getElementById("dLoad").onclick = () => {
  try {
    const parsed = JSON.parse(document.getElementById("fJson").value);
    if(!Array.isArray(parsed)) throw new Error("Top level must be a list of events");
    events = normalize(parsed); render(); hide(); toast(`Loaded ${events.length} events`);
  } catch(err){ toast("That isn't valid JSON: " + err.message); }
};

// Prefer events.json next to the page; fall back to the seed block below it.
(async () => {
  try {
    const res = await fetch("events.json", {cache:"no-store"});
    if(!res.ok) throw 0;
    events = normalize(await res.json());
  } catch {
    events = normalize(JSON.parse(document.getElementById("seed").textContent));
  }
  render();
})();

// If the sync Action has run, show when it last pulled from Outlook —
// purely informational, never blocks rendering if the file is missing.
(async () => {
  try {
    const res = await fetch("last-sync.json", {cache:"no-store"});
    if(!res.ok) throw 0;
    const { synced_at } = await res.json();
    const d = new Date(synced_at);
    const stamp = d.toLocaleString(undefined, { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
    document.getElementById("syncedAt").textContent = `Synced from Outlook · ${stamp}`;
  } catch { /* no sync file yet — fine, just don't show a timestamp */ }
})();
</script>
</body>
</html>
